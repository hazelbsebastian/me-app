<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Wellness</title>
  <meta name="description" content="Personal wellness tracker: calories, meals, water, workouts and cycle.">
  <meta name="theme-color" content="#7d9a7e">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Wellness">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><img src="icons/icon.svg" alt="" width="32" height="32"><span>My Wellness</span></div>
      <nav id="side-nav" class="side-nav" aria-label="Main"></nav>
    </aside>

    <div class="content">
      <header class="topbar">
        <div>
          <h1 id="page-title">My Wellness</h1>
          <p id="page-sub" class="muted"></p>
        </div>
        <a href="#/settings" class="icon-btn settings-link" id="settings-link" aria-label="Settings"></a>
      </header>
      <main id="main" tabindex="-1">
        <p class="empty">Loading…</p>
      </main>
    </div>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Main"></nav>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <noscript><p class="empty">Please turn on JavaScript to use this app.</p></noscript>

  <!-- Order matters: each file uses the ones above it. -->
  <script src="js/db.js"></script>
  <script src="js/data.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/views/shared.js"></script>
  <script src="js/views/onboarding.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/nutrition.js"></script>
  <script src="js/views/workouts.js"></script>
  <script src="js/views/cycle.js"></script>
  <script src="js/views/progress.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
